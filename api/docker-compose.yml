# Projeto da API (sozinho): MySQL + API REST
# Subir:  cd api  &&  docker compose up --build -d
#   API:     http://localhost:8080/api/filmes
#   Swagger: http://localhost:8080/api/docs/
name: cinesugere-api

services:
  mysql:
    image: mysql:8.4
    container_name: cinesugere-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mvc_java
      MYSQL_USER: mvc_user
      MYSQL_PASSWORD: mvc123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umvc_user", "-pmvc123"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    container_name: cinesugere-api
    environment:
      DB_HOST: mysql
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
