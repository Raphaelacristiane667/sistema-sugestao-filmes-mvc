# Atalho opcional para subir os DOIS projetos de uma vez.
# Cada um continua independente, com seu próprio compose e seus próprios containers:
#   api/docker-compose.yml  ->  cinesugere-mysql + cinesugere-api   (porta 8080)
#   web/docker-compose.yml  ->  cinesugere-mvc                       (porta 8081)
# O MVC fala com a API só por HTTP, pela porta 8080 publicada.
include:
  - api/docker-compose.yml
  - web/docker-compose.yml
